services:
  postgres:
    image: postgres:17-alpine@sha256:266d3c257594e195b309ae9d1805e54c788f1d7b375f56bf6c367aac6c917e7b
    environment:
      POSTGRES_DB: oasis
      POSTGRES_USER: oasis
      POSTGRES_PASSWORD: ${OASIS_DB_PASSWORD:?Set OASIS_DB_PASSWORD}
    ports:
      - "127.0.0.1:${OASIS_DB_PORT:-55432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oasis -d oasis"]
      interval: 2s
      timeout: 3s
      retries: 20
  bank:
    build: ./bank-server
    environment:
      OASIS_DATABASE_URL: postgresql://oasis@postgres:5432/oasis
      PGPASSWORD: ${OASIS_DB_PASSWORD:?Set OASIS_DB_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${OASIS_BANK_BIND:-0.0.0.0}:${OASIS_BANK_PORT:-8443}:8443"
    volumes:
      - bank-state:/var/lib/oasis
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "/app/bank.py", "--state", "/var/lib/oasis/keys", "health"]
      interval: 5s
      timeout: 4s
      retries: 8
volumes:
  postgres-data:
  bank-state:
