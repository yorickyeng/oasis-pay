plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.plugin.compose'
}

android {
    namespace = 'ru.oasispay'
    compileSdk = 37

    defaultConfig {
        applicationId = 'ru.oasispay.relay'
        minSdk = 33
        targetSdk = 37
        versionCode = 5
        versionName = '1.4'
        testInstrumentationRunner = 'androidx.test.runner.AndroidJUnitRunner'
    }

    def releaseStore = providers.environmentVariable('OASIS_ANDROID_KEYSTORE')
    def releasePassword = providers.environmentVariable('OASIS_ANDROID_KEY_PASSWORD')
    signingConfigs {
        if (releaseStore.isPresent() && releasePassword.isPresent()) {
            release {
                storeFile = file(releaseStore.get())
                storePassword = releasePassword.get()
                keyAlias = 'oasis-pay'
                keyPassword = releasePassword.get()
                storeType = 'PKCS12'
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled = true
            shrinkResources = true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
            if (signingConfigs.findByName('release') != null) {
                signingConfig = signingConfigs.release
            }
        }
    }

    sourceSets.main.kotlin.srcDir('../shared/src/main/kotlin')
    buildFeatures { compose = true; buildConfig = true }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
}
kotlin { compilerOptions { jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17) } }

dependencies {
    implementation platform('androidx.compose:compose-bom:2026.09.00')

    implementation 'androidx.activity:activity-compose:1.13.0'
    implementation 'androidx.compose.material3:material3:1.4.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.11.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.11.0'
    implementation 'androidx.fragment:fragment:1.9.1'
    implementation 'com.upokecenter:cbor:4.5.6'
    implementation platform('com.squareup.okhttp3:okhttp-bom:5.3.2')
    implementation 'com.squareup.okhttp3:okhttp'
    testImplementation 'com.squareup.okhttp3:okhttp-tls'
    testImplementation 'com.squareup.okhttp3:mockwebserver3'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test:runner:1.7.0'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
}
